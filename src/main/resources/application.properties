# =============================================================
# BANFICO MINI BANKING SYSTEM - application.properties
# =============================================================
# This file is the central configuration file for Spring Boot.
# Spring Boot reads this file automatically at startup.
# You can override any setting here without changing Java code.
# =============================================================


# -------------------------------------------------------------
# APPLICATION INFO
# These are custom properties we define ourselves.
# We can inject them into Java classes using @Value("${...}")
# -------------------------------------------------------------
spring.application.name=Banfico Banking System
application.version=1.0.0


# -------------------------------------------------------------
# SERVER CONFIGURATION
# Spring Boot starts an embedded Tomcat server automatically.
# No need to install Tomcat separately — it's bundled inside
# the JAR. By default it runs on port 8080.
# -------------------------------------------------------------
server.port=8080


# -------------------------------------------------------------
# POSTGRESQL DATABASE CONFIGURATION
#
# Spring Boot uses these settings to create a connection pool
# to your PostgreSQL database.
#
# Make sure PostgreSQL is running and the database "bankingdb"
# exists before starting the application.
#
# To create the database, open psql and run:
#   CREATE DATABASE bankingdb;
# -------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/bankingdb
spring.datasource.username=postgres
spring.datasource.password=9655875019
spring.datasource.driver-class-name=org.postgresql.Driver


# -------------------------------------------------------------
# JPA / HIBERNATE CONFIGURATION
#
# JPA (Java Persistence API) is the standard for talking to
# databases in Java. Hibernate is the implementation Spring
# Boot uses under the hood.
#
# ddl-auto options:
#   none        → do nothing to the schema (use in production)
#   validate    → check schema matches entities, fail if not
#   update      → add missing columns/tables automatically ✅ dev
#   create      → drop and recreate all tables on every start
#   create-drop → like create, but drops tables when app stops
#
# show-sql=true prints every SQL query to the console so you
# can see exactly what Hibernate is doing — great for learning!
# -------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


# -------------------------------------------------------------
# LOGGING
# Controls how much detail Spring Boot prints to the console.
# Levels: TRACE < DEBUG < INFO < WARN < ERROR
# -------------------------------------------------------------
logging.level.com.banfico.bankingsystem=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
